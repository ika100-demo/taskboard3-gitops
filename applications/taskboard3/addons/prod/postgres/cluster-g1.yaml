apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: taskboard3-postgres-g1
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: taskboard3
    app.kubernetes.io/managed-by: gitops-app
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-202610260819-standard-trixie@sha256:ed6923f9ba2399cf9070379a353c710c29ced8a294be73986a2c3dae7e599ce3
  storage:
    size: 20Gi
  enableSuperuserAccess: false
  bootstrap:
    recovery:
      source: origin
      database: taskboard3
      owner: taskboard3
      secret:
        name: taskboard3-postgres-app
  externalClusters:
  - name: origin
    plugin:
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: taskboard3-postgres
        serverName: taskboard3-postgres
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
