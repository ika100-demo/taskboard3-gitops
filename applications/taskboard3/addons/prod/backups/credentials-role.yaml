apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: taskboard3-backups-credentials
  labels:
    app.kubernetes.io/name: backups
    app.kubernetes.io/part-of: taskboard3
    app.kubernetes.io/managed-by: gitops-app
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: '0'
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - create
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - taskboard3-backups-app
  verbs:
  - get
  - patch
- apiGroups:
  - external-secrets.io
  resources:
  - externalsecrets
  resourceNames:
  - taskboard3-backups-app
  verbs:
  - get
  - delete
- apiGroups:
  - generators.external-secrets.io
  resources:
  - passwords
  resourceNames:
  - taskboard3-backups-access-key
  - taskboard3-backups-secret-key
  verbs:
  - delete
