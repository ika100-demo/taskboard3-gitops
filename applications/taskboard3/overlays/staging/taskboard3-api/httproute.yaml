apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: taskboard3-api
  labels:
    app: taskboard3-api
    app.kubernetes.io/name: taskboard3-api
    app.kubernetes.io/part-of: taskboard3
    app.kubernetes.io/managed-by: gitops-app
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: kube-system
  hostnames:
  - taskboard3-api.taskboard3-staging.localhost
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: taskboard3-api
      port: 80
